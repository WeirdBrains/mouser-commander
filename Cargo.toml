[package]
name = "mouser-commander"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
license = "BSD-3-Clause"
authors = ["Mouser Contributors"]
description = "Mouser's commander mode as a plugin: the shell's folder above the prompt, with previews and the media player"
repository = "https://github.com/WeirdBrains/mouser-commander"
homepage = "https://github.com/WeirdBrains/mouser-commander"
readme = "README.md"
keywords = ["terminal", "mouser", "file-manager", "plugin"]
categories = ["command-line-utilities"]
exclude = ["/.github", "/legacy"]

[dependencies]
mouser-mode-api = { features = ["markdown"], version = "0.1" }
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
toml = "0.8.19"
dirs = "5.0.1"
once_cell = "1.20.2"
image = { version = "0.25.2", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
cpal = "0.15"

[dev-dependencies]
tempfile = "3.10.1"
serial_test = "3.0.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
time = { version = "0.3.36", features = ["macros", "formatting"] }

[lints.rust]
rust_2018_idioms = "warn"
unused_qualifications = "warn"
unexpected_cfgs = "warn"
